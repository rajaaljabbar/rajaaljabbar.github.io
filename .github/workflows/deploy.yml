name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stamp deploy version & inject Web3Forms secret
        env:
          W3F_KEY: ${{ secrets.WEB3FORMS_ACCESS_KEY }}
        run: |
          touch assets/js/config.local.js
          sed -i "s/pra-kernel@v[^ ]*/pra-kernel@v2.1.${{ github.run_number }}/g" index.html
          if [ -n "$W3F_KEY" ]; then
            sed -i "s/__WEB3FORMS_KEY__/$W3F_KEY/g" assets/js/main.js
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
